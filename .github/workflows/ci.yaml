name: CI Local (kind)

on:
  push:
    branches: [dev]

env:
  IMAGE_NAME: harbinger
  IMAGE_REGISTRY: localhost:5000
  TAG: ${{ github.sha }}
  HELM_CHART_PATH: ./chart
  HELM_VALUES: ./chart/values-local.yaml
  KIND_CLUSTER_NAME: harbinger
  KIND_VERSION: v0.23.0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build \
            --platform linux/amd64 \
            --tag ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.TAG }} \
            --tag ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            .

      - name: Verify image builds
        run: docker inspect ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.TAG }}

      - name: Save image for kind
        run: |
          docker save ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.TAG }} \
            -o /tmp/harbinger.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: harbinger-image
          path: /tmp/harbinger.tar
          retention-days: 1

  deploy-kind:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: harbinger-image
          path: /tmp

      - name: Create kind cluster
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: ${{ env.KIND_CLUSTER_NAME }}
          version: ${{ env.KIND_VERSION }}
          config: |
            kind: Cluster
            apiVersion: kind.x-k8s.io/v1alpha4
            nodes:
            - role: control-plane
              extraPortMappings:
              - containerPort: 8080
                hostPort: 8080
                listenAddress: "127.0.0.1"
                protocol: TCP

      - name: Load image into kind
        run: |
          kind load image-archive /tmp/harbinger.tar \
            --name ${{ env.KIND_CLUSTER_NAME }}

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Deploy to kind with Helm
        run: |
          helm upgrade --install harbinger ${{ env.HELM_CHART_PATH }} \
            --values ${{ env.HELM_VALUES }} \
            --set image.tag=${{ env.TAG }} \
            --set image.pullPolicy=Never \
            --wait \
            --timeout 5m

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/harbinger -n default --timeout=2m

      - name: Health check
        run: |
          kubectl run curl-test \
            --image=curlimages/curl:latest \
            --rm -i --restart=Never -- \
            curl -f http://harbinger:8080/healthz

      - name: Test /scan endpoint
        run: |
          kubectl run scan-test \
            --image=curlimages/curl:latest \
            --rm -i --restart=Never -- \
            curl -f -X POST http://harbinger:8080/scan \
              -H "Content-Type: application/json" \
              -d '{"image": "alpine:3.21.0"}' \
              -w "\nHTTP Status: %{http_code}\n"

      - name: Get pod logs on failure
        if: failure()
        run: |
          echo "=== Pod Status ===" && kubectl get pods
          echo "=== Deployment Status ===" && kubectl get deployment
          echo "=== Service Status ===" && kubectl get service
          echo "=== Pod Logs ===" && kubectl logs -l app.kubernetes.io/name=harbinger --tail=50
